server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API: diteruskan ke service "backend" lewat jaringan Docker Compose.
    # Resolver Docker + variabel membuat nama "backend" di-resolve saat request,
    # jadi Nginx tidak gagal start dan tidak menyimpan IP lama bila backend di-recreate.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback SPA (vue-router history mode): refresh di /books tidak 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
