name: CI
 
# Jalan di semua branch (push) dan semua PR. Job deploy ditambahkan nanti
# di feature/deploy-ghcr dengan gating di level job, bukan di sini.
on:
  push:
  pull_request:
 
permissions:
  contents: read
 
jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: uts_books
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      APP_KEY: ${{ secrets.APP_KEY }}
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: uts_books
      DB_USERNAME: root
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      # Verifikasi versi major terbaru di halaman Releases masing-masing action
      # sebelum commit; v4 dipakai karena pasti tersedia.
      - uses: actions/checkout@v4
 
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, pdo_sqlite
          coverage: none
 
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
 
      # Smoke check: migrasi jalan di MySQL 8.4 (DB_* dari env level job).
      - name: Migrate on MySQL
        run: php artisan migrate --force
 
      # phpunit.xml tidak memaksa DB (baris sqlite dikomentari), jadi tes
      # berjalan di MySQL 8.4 lewat env level job.
      - name: Run tests
        run: php artisan test
 
  build:
    name: build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
 
      - name: Install dependencies
        run: npm ci
 
      - name: Build
        run: npm run build
